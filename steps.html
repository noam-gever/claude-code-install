<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מתקינים את קלוד קוד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Montserrat:wght@900&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --clay:#D97757; --clay-lt:#E89B7D; --clay-dp:#A8492C;
  --bg:#14100E; --bg-2:#1C1714;
  --tone:#14100E;
  --w:#F6F2EC; --w70:#ACA49B; --w45:#9A9288;
  --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.2);
  --box:rgba(255,255,255,.05);
  --ok:#6FB58A;
  --e:cubic-bezier(.2,.8,.25,1);
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{
  margin:0; direction:rtl; background:var(--bg); color:var(--w);
  font-family:Heebo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2{margin:0; line-height:1.1; font-weight:900; letter-spacing:-.035em; text-wrap:balance}
p{margin:0}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
a{color:var(--clay-lt)}
:focus-visible{outline:2.5px solid var(--clay); outline-offset:3px; border-radius:10px}
.mono{font-family:"Space Mono",ui-monospace,monospace; letter-spacing:.02em}
.logo{font-family:Montserrat,sans-serif; font-weight:900; letter-spacing:-.035em; user-select:none}
.logo i{font-style:normal; color:var(--clay)}

/* ── אווירה: שלוש שכבות שנעות באיטיות ── */
.air,.tone,.grid-l{position:fixed; inset:0; z-index:0; pointer-events:none}
/* גוון הרקע של השלב, מתמוסס פנימה */
.tone{background-color:#14100E; opacity:0;
  transition:opacity 1.2s cubic-bezier(.2,.8,.25,1), background-color 1.5s cubic-bezier(.2,.8,.25,1)}
.tone.on{opacity:1}
/* גריד קבוע */
.grid-l{
  background:
    linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
  background-size:78px 78px;
  mask-image:radial-gradient(ellipse 92% 78% at 50% 40%,#000 30%,transparent 96%);
}
/* זוהר שנודד */
.air{
  background:radial-gradient(ellipse 56% 44% at var(--gx,50%) var(--gy,-8%), var(--gc,rgba(217,119,87,.32)), transparent 64%);
  transition:background 1.6s cubic-bezier(.2,.8,.25,1);
}

/* ── סרגל ── */
.bar{position:fixed; top:0; inset-inline:0; z-index:30; height:56px;
  display:flex; align-items:center; gap:18px; padding:0 22px;
  background:rgba(20,16,14,.72); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line); opacity:0; pointer-events:none;
  transition:opacity .4s var(--e)}
.bar.on{opacity:1; pointer-events:auto}
.bar .logo{font-size:15px}
.dots{display:flex; gap:7px; margin-inline-start:auto}
.dots i{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.16);
  transition:all .4s var(--e)}
.dots i.now{background:var(--clay); transform:scale(1.25)}
.dots i.done{background:var(--ok)}
.chip{display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:99px;
  background:var(--box); border:1px solid var(--line); font-size:13px; color:var(--w70)}
.chip svg{width:14px; height:14px}
.chip button{font-size:12px; color:var(--clay-lt); text-decoration:underline; padding:2px}

/* ── מסך ── */
.scr{position:fixed; inset:0; z-index:10; display:none;
  overflow-y:auto; overscroll-behavior:contain;
  padding:76px 22px 40px; place-items:start center}
.scr.on{display:grid; animation:in .5s var(--e)}
.scr.out{display:grid; animation:out .34s var(--e) forwards; pointer-events:none}
@keyframes in{from{opacity:0; transform:translateX(28px) scale(.985)} to{opacity:1; transform:none}}
@keyframes out{to{opacity:0; transform:translateX(-24px) scale(.985)}}
.scr.rev.on{animation:inRev .5s var(--e)}
.scr.rev.out{animation:outRev .34s var(--e) forwards}
@keyframes inRev{from{opacity:0; transform:translateX(-28px) scale(.985)} to{opacity:1; transform:none}}
@keyframes outRev{to{opacity:0; transform:translateX(24px) scale(.985)}}

/* כניסה מדורגת של האלמנטים בתוך המסך */
.scr.on .stg{animation:rise .55s var(--e) backwards}
.scr.on .stg:nth-child(1){animation-delay:.06s}
.scr.on .stg:nth-child(2){animation-delay:.13s}
.scr.on .stg:nth-child(3){animation-delay:.2s}
.scr.on .stg:nth-child(4){animation-delay:.27s}
.scr.on .stg:nth-child(5){animation-delay:.34s}
.scr.on .stg:nth-child(6){animation-delay:.41s}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.pane{width:100%; max-width:680px; margin:auto}

/* ── מסך הפתיחה ── */
#pick{padding-top:26px}
#pick .pane{max-width:640px; text-align:center}
.hero-logo{font-size:22px; margin-bottom:34px}
#pick h1{font-size:clamp(40px,9vw,68px); letter-spacing:-.045em}
#pick h1 em{font-style:normal; color:var(--clay); display:block}
.lead{margin:20px auto 0; max-width:34ch; font-size:18px; font-weight:300; color:var(--w70)}
.ask{margin:44px 0 14px; font-size:15px; font-weight:500; color:var(--w45)}
.picks{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.pk{position:relative; overflow:hidden; padding:34px 16px 28px; border-radius:22px;
  background:var(--box); border:1px solid rgba(217,119,87,.3); color:var(--w);
  display:flex; flex-direction:column; align-items:center; gap:12px;
  box-shadow:0 16px 44px rgba(0,0,0,.4);
  transition:transform .3s var(--e), border-color .3s, background .3s}
.pk::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 90% 70% at 50% 0%,rgba(217,119,87,.3),transparent 72%);
  opacity:.45; transition:opacity .3s}
.pk:hover{transform:translateY(-7px); border-color:rgba(217,119,87,.8); background:rgba(255,255,255,.08)}
.pk:hover::after{opacity:1}
.pk svg{width:54px; height:54px; color:var(--clay-lt); position:relative}
.pk b{font-size:21px; font-weight:700; position:relative}
.need{margin-top:34px; display:flex; flex-wrap:wrap; justify-content:center;
  gap:8px 14px; font-size:14px; color:var(--w45); font-weight:300}
.need b{color:#F0C2AC; font-weight:500}
.need i{font-style:normal; opacity:.4}

/* ── המספר הענק ── */
.ghost{position:absolute; z-index:0; pointer-events:none; user-select:none;
  font-family:Montserrat,sans-serif; font-weight:900; line-height:.7;
  font-size:clamp(300px,46vw,680px); letter-spacing:-.07em; color:var(--w);
  inset-inline-start:-.06em; top:50%; opacity:0;
  transform:translateY(-50%) scale(.92);
  transition:opacity 1s var(--e), transform 1.2s var(--e)}
.scr.on .ghost{opacity:.055; transform:translateY(-50%) scale(1)}
.scr.alt .ghost{inset-inline-start:auto; inset-inline-end:-.06em}
@media (max-width:900px){.ghost{font-size:clamp(230px,66vw,400px)}}

/* ── מסך שלב ── */
.grid{display:block}
.vid{position:relative; width:100%; max-width:640px; margin:22px auto 0; aspect-ratio:2154/1440; border-radius:18px; overflow:hidden;
  background:#000; box-shadow:0 22px 56px rgba(0,0,0,.5), 0 0 0 1px var(--line-2)}
.vid iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.vid.none{display:grid; place-items:center; width:100%; max-width:640px; margin:22px auto 0; aspect-ratio:2154/1440; background:var(--box);
  border:1px dashed var(--line-2); box-shadow:none}
.vid.none span{font-size:14px; color:var(--w45); font-weight:300}

.eyebrow{display:flex; align-items:center; gap:12px; font-size:12px; font-weight:700;
  letter-spacing:.16em; color:var(--w45); margin-bottom:14px}
.eyebrow s{flex:1; height:1px; background:var(--line); text-decoration:none}
.scr h2{font-size:clamp(30px,4.4vw,44px)}
.acts{margin:26px 0 0; padding:0; list-style:none; counter-reset:a; display:grid; gap:11px}
.acts li{counter-increment:a; position:relative; padding:14px 56px 14px 16px;
  font-size:16.5px; line-height:1.55; color:var(--w); font-weight:300;
  background:rgba(255,255,255,.045); border:1px solid var(--line); border-radius:14px}
.acts li b{font-weight:600}
.acts li::before{content:counter(a); position:absolute; right:14px; top:13px;
  width:30px; height:30px; border-radius:10px;
  background:var(--pip,#A8492C); color:#fff;
  font-family:"Space Mono",monospace; font-size:14px; font-weight:700;
  display:grid; place-items:center;
  transition:background .9s cubic-bezier(.2,.8,.25,1)}
.acts code{background:rgba(0,0,0,.42); border:1px solid var(--line-2); color:#F3C7B2;
  padding:2px 8px; border-radius:6px; font-family:"Space Mono",monospace; font-size:13.5px;
  direction:ltr; display:inline-block}
.acts a{text-decoration:underline}

.go{margin-top:22px; width:100%; padding:17px; border-radius:14px;
  background:var(--clay-dp); color:#fff; font-size:17.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:10px;
  box-shadow:0 12px 30px rgba(168,73,44,.4);
  transition:filter .2s, transform .12s var(--e)}
.go:hover{filter:brightness(1.14)}
.go:active{transform:scale(.985)}
.go svg{width:18px; height:18px}

.back{margin-top:16px; display:inline-flex; align-items:center; gap:7px;
  font-size:14.5px; color:var(--w45); transition:color .2s}
.back:hover{color:var(--clay-lt)}
.back svg{width:13px; height:13px}

/* שורת ההצלחה */
.win-box{margin-top:16px; display:flex; align-items:center; gap:14px;
  padding:18px 20px; border-radius:15px;
  background:rgba(111,181,138,.13); border:1.5px solid rgba(111,181,138,.45);
  font-size:17px; font-weight:600; color:#B8E4C8; line-height:1.45}
.win-box .v{width:30px; height:30px; border-radius:50%; flex-shrink:0;
  background:var(--ok); color:#10201A; display:grid; place-items:center}
.win-box .v svg{width:16px; height:16px}

/* ── שאלות, בתוך המסך ── */
.oops-wrap{margin-top:24px}
.oops-t{display:flex; align-items:center; gap:12px; width:100%; padding:16px 20px;
  font-size:17px; font-weight:600; color:var(--w);
  background:rgba(255,255,255,.05); border:1.5px solid var(--line-2); border-radius:14px;
  transition:all .25s var(--e)}
.oops-t:hover{border-color:var(--clay); background:rgba(217,119,87,.1)}
.oops-wrap.on .oops-t{border-color:var(--clay); background:rgba(217,119,87,.12);
  border-radius:14px 14px 0 0}
.oops-t .pm{position:relative; width:15px; height:15px; flex-shrink:0; color:var(--clay-lt)}
.oops-t .pm::before,.oops-t .pm::after{content:""; position:absolute; background:currentColor;
  border-radius:2px; transition:transform .3s var(--e)}
.oops-t .pm::before{inset:6px 0; height:3px}
.oops-t .pm::after{inset:0 6px; width:3px}
.oops-wrap.on .oops-t .pm::after{transform:scaleY(0)}
.oops-t .n{margin-inline-start:auto; font-family:"Space Mono",monospace; font-size:13px;
  color:var(--clay-lt); background:rgba(217,119,87,.16); padding:3px 10px; border-radius:99px}
.roll{display:grid; grid-template-rows:0fr; transition:grid-template-rows .4s var(--e)}
.oops-wrap.on .roll{grid-template-rows:1fr}
.roll>div{overflow:hidden}
.qa{display:grid; max-height:min(44vh,320px); overflow-y:auto; overscroll-behavior:contain;
  padding:4px 20px; background:rgba(255,255,255,.03);
  border:1.5px solid var(--clay); border-top:none; border-radius:0 0 14px 14px}
.qa .it{border-top:1px solid var(--line)}
.qa .it:first-child{border-top:none}
.qa button{width:100%; text-align:right; padding:13px 0; display:flex; gap:11px;
  align-items:flex-start; font-size:15.5px; font-weight:500; color:var(--w)}
.qa button:hover{color:var(--clay-lt)}
.qa button svg{width:13px; height:13px; color:var(--w45); flex-shrink:0; margin-top:5px;
  margin-inline-start:auto; transition:transform .3s var(--e)}
.qa .it.on button svg{transform:rotate(180deg); color:var(--clay)}
.qa .ans{display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s var(--e)}
.qa .it.on .ans{grid-template-rows:1fr}
.qa .ans>div{overflow:hidden}
.qa .ans p{padding:0 0 14px; font-size:15px; color:var(--w70); font-weight:300; line-height:1.6}
.qa code{background:rgba(0,0,0,.42); border:1px solid var(--line-2); color:#F3C7B2;
  padding:1.5px 7px; border-radius:6px; font-family:"Space Mono",monospace; font-size:13px;
  direction:ltr; display:inline-block}
.qa a{text-decoration:underline}

/* ── סיום ── */
#done .pane{max-width:560px; text-align:center}
.seal{width:78px; height:78px; border-radius:50%; background:var(--clay); color:#fff;
  display:grid; place-items:center; margin:0 auto 24px;
  box-shadow:0 16px 44px rgba(217,119,87,.45); animation:pop .5s var(--e)}
@keyframes pop{from{transform:scale(.6); opacity:0} to{transform:none; opacity:1}}
.seal svg{width:36px; height:36px}
#done h2{font-size:clamp(36px,7vw,58px); letter-spacing:-.04em}
#done h2 em{font-style:normal; color:var(--clay); display:block}
#done p{margin-top:16px; color:var(--w70); font-weight:300; font-size:18px}
.cta{margin-top:32px; display:inline-flex; align-items:center; gap:11px; padding:19px 40px;
  border-radius:15px; background:var(--clay-dp); color:#fff; font-size:18px; font-weight:700;
  text-decoration:none; box-shadow:0 14px 36px rgba(168,73,44,.42);
  transition:filter .2s, transform .12s var(--e)}
.cta:hover{filter:brightness(1.14)}
.cta:active{transform:scale(.98)}
.cta svg{width:18px; height:18px}
.again{margin-top:22px; font-size:14px; color:var(--w45); text-decoration:underline}

@media (max-width:900px){
  .scr{padding:70px 18px 30px}
  .scr h2{font-size:29px}
  .acts li{font-size:16.5px; padding:12px 36px 12px 0}
  .picks{gap:11px}
  .pk{flex-direction:row; justify-content:flex-start; padding:20px; gap:16px}
  .pk svg{width:38px; height:38px}
  .bar{gap:12px; padding:0 16px}
  .chip span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="tone" id="tone"></div>
<div class="grid-l"></div>
<div class="air" id="air"></div>

<div class="bar" id="bar">
  <span class="logo">NOAM<i>AI</i></span>
  <span class="chip">
    <svg id="osIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"></svg>
    <span id="osName"></span>
    <button id="swap" type="button">החלף</button>
  </span>
  <span class="dots" id="dots"></span>
</div>

<!-- בחירה -->
<section class="scr on" id="pick">
  <div class="pane">
    <div class="hero-logo logo">NOAM<i>AI</i></div>
    <h1>עשר דקות.<em>וזהו.</em></h1>
    <p class="lead">מתקינים את קלוד קוד ביחד. בלי טרמינל, בלי פקודות.</p>
    <p class="ask">על איזה מחשב אתם?</p>
    <div class="picks">
      <button class="pk" data-os="mac" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.7 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.8-1.7 0-3.2 1-4.1 2.5-1.7 3-.4 7.5 1.3 10 .8 1.2 1.8 2.5 3.1 2.5 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.4-.9-2.4-3.6zM14.3 5.2c.7-.8 1.1-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/></svg>
        <b>מק</b>
      </button>
      <button class="pk" data-os="win" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.6l7.3-1v7.1H3V5.6zm0 12.8l7.3 1v-7H3v6zm8.2 1.1L21 21V12.6h-9.8v6.9zm0-14.1v7.2H21V3l-9.8 1.4z"/></svg>
        <b>ווינדוס</b>
      </button>
    </div>
    <p class="need">
      <span id="needSys"></span> <i>·</i>
      <span><b>מנוי בתשלום, מ-20 דולר לחודש</b></span> <i>·</i>
      <span>חיבור לאינטרנט</span>
    </p>
  </div>
</section>

<!-- שלבים -->
<div id="steps"></div>

<!-- סיום -->
<section class="scr" id="done">
  <div class="pane">
    <div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h2>זהו.<em>זה עובד.</em></h2>
    <p>קלוד קוד פתוח אצלכם. נתראה בקורס.</p>
    <a class="cta" href="#" id="cta">
      לשיעור הראשון
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <br><button class="again" id="again" type="button">להתחיל מהתחלה</button>
  </div>
</section>

<script>
/* ═══ קישורי הסרטונים. רק המזהה, החלק שאחרי v= ═══ */
const VIDEOS={
  mac:{ install:'Tq4NcpeQieo', account:'u7G8oPNWUkE', ready:'PJ6pErVxD8E' },
  win:{ git:'', install:'', account:'', ready:'' }
};
const LESSON = '#';   /* ← כאן הקישור לשיעור הראשון */

const ICON={
 mac:'<path d="M16.7 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.8-1.7 0-3.2 1-4.1 2.5-1.7 3-.4 7.5 1.3 10 .8 1.2 1.8 2.5 3.1 2.5 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.4-.9-2.4-3.6zM14.3 5.2c.7-.8 1.1-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/>',
 win:'<path d="M3 5.6l7.3-1v7.1H3V5.6zm0 12.8l7.3 1v-7H3v6zm8.2 1.1L21 21V12.6h-9.8v6.9zm0-14.1v7.2H21V3l-9.8 1.4z"/>'
};
const SYS={mac:'מק עם macOS 13 ומעלה', win:'ווינדוס 10 ומעלה'};

/* ═══ השלבים. טקסט מינימלי, הכל השאר בתקלות ═══ */
const GIT={
 t:'מתקינים Git', k:'git',
 acts:['נכנסים ל<a href="https://git-scm.com/downloads/win" target="_blank" rel="noopener">git-scm.com/downloads/win</a> ומורידים.',
       'מריצים, ולוחצים <code>Next</code> (הבא) עד <code>Install</code> (התקנה).',
       'מפעילים את המחשב מחדש.'],
 fx:[['יש מלא מסכים ואני לא יודע מה לבחור','לא צריך לבחור כלום. Next בכל מסך.'],
     ['זה מסוכן? זה משנה משהו במחשב?','לא. תוכנה קטנה שיושבת בצד וקלוד צריך אותה.'],
     ['אפשר לדלג?','בווינדוס לא. בלי זה קלוד לא יתחיל.'],
     ['ההתקנה נכשלה','קליק ימני על הקובץ ← "הפעל כמנהל".']]
};
const INSTALL=os=>({
 t:'מתקינים את קלוד', k:'install',
 acts: os==='mac' ? [
   'נכנסים ל<a href="https://claude.ai/download" target="_blank" rel="noopener">claude.ai/download</a> ומורידים.',
   'פותחים את הקובץ וגוררים את הסמל לתיקייה שלידו.',
   'פותחים את קלוד ולוחצים <code>Get started</code> (התחלה).'
 ] : [
   'נכנסים ל<a href="https://claude.ai/download" target="_blank" rel="noopener">claude.ai/download</a> ומורידים.',
   'פותחים ומתקינים את הקובץ.',
   'פותחים את קלוד ולוחצים <code>Get started</code> (התחלה).'
 ],
 fx:(os==='mac'?[
   ['כתוב "המפתח לא מזוהה"','הגנה של אפל. קליק ימני על האפליקציה ← "פתח", ואז "פתח" שוב.'],
   ['גררתי וכלום לא קרה','לחפש "Claude" בזכוכית מגדלת למעלה. אם הוא שם, הכל בסדר.'],
   ['כתוב שהמערכת לא נתמכת','המק ישן מדי. אין פתרון.']
 ]:[
   ['ווינדוס אומר שהוא הגן על המחשב','"מידע נוסף" ואז "הפעל בכל זאת". זה נורמלי.'],
   ['כתוב שהמערכת לא נתמכת','הווינדוס ישן מדי. אין פתרון.'],
   ['האנטי-וירוס חוסם','להוסיף חריגה. ההורדה מהאתר הרשמי.'],
   ['מחשב חדש ודק וההתקנה לא רצה','מקש ווינדוס ← "אודות" ← "סוג מערכת". אם כתוב ARM, חוזרים לעמוד ההורדה ובוחרים את הגרסה ל-ARM.']
 ]).concat([
   ['לא מוצא את הקובץ שירד','הוא בתיקיית "הורדות".'],
   ['הדפדפן נפתח ותקוע','לסגור אותו לגמרי ולנסות שוב.']
 ])
});
const PAY={
 t:'נכנסים ומשלמים', k:'account',
 note:'20 דולר לחודש. אפשר לבטל מתי שרוצים.',
 acts:['נרשמים, או מתחברים לחשבון שכבר יש לכם.',
       'לוחצים על השם שלכם למטה, ואז <code>Upgrade plan</code> (שדרוג המנוי).',
       'בוחרים <code>Pro</code> ומשלמים.'],
 warn:'באותו מסך יש מחיר שנראה זול יותר, אבל הוא <b>שנתי</b>. אם אתם לא בטוחים, תבחרו את החודשי.',
 fx:[['כבר יש לי חשבון חינמי','אותו חשבון. משדרגים אותו, לא פותחים חדש.'],
     ['אין לי כרטיס אשראי','אפשר גם דרך PayPal.'],
     ['המחירים בשקלים ולא בדולרים','בסדר גמור. אותו מנוי.'],
     ['רוצה לנסות לפני שאני משלם','אפשר לבטל בכל רגע.'],
     ['שילמתי וזה עדיין לא עובד','לצאת מהחשבון בקלוד ולהיכנס שוב.'],
     ['יש לי Max או Team','גם הם עובדים.']]
};
const READY=os=>({
 t:'בדיקה אחרונה', k:'ready',
 /* מק — כפי שהיה, לפי הסרטון שכבר צולם */
 acts: os==='mac' ? [
   'פותחים את קלוד. אם תקפוץ בקשה להתקין כלי עזר, עוקבים אחרי ההוראות עד הסוף.',
   'פותחים תיקייה חדשה על שולחן העבודה בשם <b>קלוד קוד</b>.',
   'בקלוד עוברים למעלה מהצ\'אט אל <b>קלוד קוד</b>, ובוחרים את התיקייה.',
   'מאשרים את כל ההודעות שיקפצו, וכותבים לו <b>שלום</b>.'
 ] : [
   'פותחים <b>תיקייה חדשה</b> על שולחן העבודה. קוראים לה איך שרוצים.',
   'בתוכנת קלוד עוברים למעלה מהצ\'אט אל <b>קלוד קוד</b>.',
   'למטה בוחרים את <b>התיקייה החדשה</b> שהרגע יצרתם, ומאשרים את ההודעות שיקפצו.',
   'כותבים בצ\'אט <b>שלום</b> ושולחים.'
 ],
 win:'קלוד ענה לכם? זהו, סיימתם. אפשר לסגור ולחכות להדרכה.',
 fx:(os==='mac'?[
   ['לחצתי התקנה וכלום לא קרה','החלונית נפתחה מאחורי קלוד. תחפשו אותה במסך הראשי.'],
   ['לא קפצה לי בקשה להתקין','יש מקים שכבר מגיעים עם הכלי. תמשיכו הלאה.'],
   ['ההתקנה לוקחת המון זמן','לפעמים שלוש-ארבע דקות. תנו לזה לרוץ.']
 ]:[
   ['כתוב <code>Git is required</code>','חסר Git. חוזרים לשלב הראשון.']
 ]).concat([
   ['לא מוצא איפה עוברים לקלוד קוד','זה למעלה במרכז. אם המסך נראה כמו צ\'אט, אתם בקלוד הרגיל.'],
   ['קלוד לא ענה לי','כנראה שכלי העזר לא הותקן. תחזרו לצעד הראשון.'],
   ['מבקש ממני לשדרג','המנוי לא נקלט. לבדוק ב<a href="https://claude.ai/settings" target="_blank" rel="noopener">claude.ai/settings</a>.'],
   ['לא נעים לי לאשר גישה','קלוד רואה רק את התיקייה שבחרתם.']
 ])
});
/* בווינדוס ההתקנה והתשלום הם שלב אחד. במק הם נפרדים, כי כך צולמו הסרטונים. */
const SETUP={
 t:'מתקינים ומשלמים', k:'install',
 note:'20 דולר לחודש. אפשר לבטל מתי שרוצים.',
 acts:['נכנסים ל<a href="https://claude.ai/download" target="_blank" rel="noopener">claude.ai/download</a> ומורידים.',
       'פותחים ומתקינים את הקובץ.',
       'פותחים את קלוד, לוחצים <code>Get started</code> (התחלה), ונרשמים.',
       'לוחצים על השם שלכם למטה, ואז <code>Upgrade plan</code> (שדרוג המנוי).',
       'בוחרים <code>Pro</code> ומשלמים.'],
 warn:'באותו מסך יש מחיר שנראה זול יותר, אבל הוא <b>שנתי</b>. אם אתם לא בטוחים, תבחרו את החודשי.',
 fx:INSTALL('win').fx.concat(PAY.fx)
};
const build=os=> os==='mac' ? [INSTALL('mac'),PAY,READY('mac')]
                            : [GIT,SETUP,READY('win')];
const NEXT=['סיימתי, הלאה','שילמתי, הלאה','התקנתי, הלאה'];
/* לכל שלב: גוון רקע, מיקום הזוהר וצבעו */
const MOOD=[
 {tone:'#14100E', gx:'50%', gy:'-10%', gc:'rgba(217,119,87,.36)', pip:'#A8492C'},
 {tone:'#2A1D14', gx:'88%', gy:'0%',   gc:'rgba(201,136,79,.34)', pip:'#8A5A1E'},
 {tone:'#3A1C12', gx:'8%',  gy:'12%',  gc:'rgba(194,100,63,.40)', pip:'#9C3B1E'},
 {tone:'#1E1A22', gx:'66%', gy:'-8%',  gc:'rgba(150,130,200,.26)', pip:'#5B4A8A'}
];

const KEY='noam-steps-v1';
let os=null, steps=[], at=-1;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function start(which,jumpTo){
  os=which; steps=build(os);
  $('#osIcon').innerHTML=ICON[os];
  $('#osName').textContent = os==='mac'?'מק':'ווינדוס';
  $('#needSys').textContent=SYS[os];
  $('#steps').innerHTML=steps.map((st,i)=>{
    const yt=(VIDEOS[os]||{})[st.k];
    const last=i===steps.length-1;
    return `<section class="scr${i%2?' alt':''}" id="s${i}">
      <span class="ghost">${i+1}</span>
      <div class="pane">
        <div class="stg eyebrow"><span class="mono">שלב ${i+1} מתוך ${steps.length}</span><s></s></div>
        <h2 class="stg">${esc(st.t)}</h2>
        ${st.note?`<p class="stg lead" style="margin:12px 0 0;text-align:right;max-width:none">${esc(st.note)}</p>`:''}
        <div class="stg">${yt
          ? `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${yt}?rel=0&hl=he"
               title="${esc(st.t)}" loading="lazy" allowfullscreen
               allow="accelerometer; encrypted-media; picture-in-picture; fullscreen"></iframe></div>`
          : `<div class="vid none"><span>הסרטון יעלה בקרוב</span></div>`}</div>
        <div class="stg">
          <ol class="acts">${st.acts.map(a=>`<li>${a}</li>`).join('')}</ol>
          ${st.warn?`<p class="lead" style="margin:16px 0 0;text-align:right;max-width:none;font-size:15.5px;color:#F0C2AC">⚠ ${st.warn}</p>`:''}
          ${st.win?`<div class="win-box">
            <span class="v"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
            <span>${st.win}</span></div>`:''}
        </div>
        <div class="stg oops-wrap">
          <button class="oops-t" data-fx type="button">
            <span class="pm"></span>נתקעתם? יש כאן פתרונות<span class="n mono">${st.fx.length}</span>
          </button>
          <div class="roll"><div><div class="qa">${st.fx.map(f=>`
            <div class="it">
              <button type="button">${f[0]}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="ans"><div><p>${f[1]}</p></div></div>
            </div>`).join('')}</div></div></div>
        </div>
        <div class="stg">
          <button class="go" data-go="${i}" type="button">
            ${last?'סיימתי!':esc(NEXT[i%NEXT.length])}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          ${i>0?`<button class="back" data-back="${i}" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            חזרה לשלב הקודם</button>`:''}
        </div>
      </div>
    </section>`;
  }).join('');
  $('#dots').innerHTML=steps.map(()=>'<i></i>').join('');
  $('#cta').href=LESSON;
  show(jumpTo==null?0:jumpTo);
}

function show(i){
  const cur=document.querySelector('.scr.on');
  const next = i<0 ? $('#pick') : (i>=steps.length ? $('#done') : $('#s'+i));
  if(cur===next) return;
  const back = i<at;
  document.querySelectorAll('.scr').forEach(x=>x.classList.toggle('rev',back));
  if(cur){ cur.classList.remove('on'); cur.classList.add('out');
    setTimeout(()=>cur.classList.remove('out'),340); }
  next.classList.add('on');
  next.scrollTop=0;
  at=i;
  $('#bar').classList.toggle('on', i>=0);
  const m=MOOD[Math.max(0,i)%MOOD.length];
  const t=$('#tone'), a=$('#air');
  t.style.backgroundColor=m.tone; t.classList.toggle('on', i>=0);
  a.style.setProperty('--gx',m.gx); a.style.setProperty('--gy',m.gy); a.style.setProperty('--gc',m.gc);
  document.documentElement.style.setProperty('--pip',m.pip);
  document.querySelectorAll('#dots i').forEach((d,n)=>{
    d.classList.toggle('now',n===i); d.classList.toggle('done',n<i);
  });
  try{ localStorage.setItem(KEY,JSON.stringify({os,at:i})) }catch(e){}
}

document.addEventListener('click',e=>{
  const pk=e.target.closest('[data-os]');
  if(pk){ start(pk.dataset.os); return; }
  const go=e.target.closest('[data-go]');
  if(go){ show(+go.dataset.go+1); return; }
  const bk=e.target.closest('[data-back]');
  if(bk){ show(+bk.dataset.back-1); return; }
  const fx=e.target.closest('[data-fx]');
  if(fx){ fx.parentElement.classList.toggle('on'); return; }
  const q=e.target.closest('.qa .it > button');
  if(q){ const it=q.parentElement;
    it.parentElement.querySelectorAll('.it').forEach(x=>{ if(x!==it) x.classList.remove('on') });
    it.classList.toggle('on'); return; }
  if(e.target.id==='swap'){ show(-1); return; }
  if(e.target.id==='again'){ try{localStorage.removeItem(KEY)}catch(e2){} show(-1); return; }
});

/* זיהוי אוטומטי + חזרה למקום */
try{
  const r=JSON.parse(localStorage.getItem(KEY)||'null');
  if(r&&r.os){ start(r.os, r.at); }
  else $('#needSys').textContent = SYS[/Win/i.test(navigator.platform||navigator.userAgent)?'win':'mac'];
}catch(e){ $('#needSys').textContent=SYS.mac }
</script>
</body>
</html>
